name: Build BLU Button Alert APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Projekt herunterladen
        uses: actions/checkout@v5

      - name: Java 17 einrichten
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle Wrapper ausführbar machen
        run: chmod +x gradlew

      - name: APK bauen
        run: ./gradlew assembleDebug

      - name: APK bereitstellen
        uses: actions/upload-artifact@v7
        with:
          name: BLU-Button-Alert-APK
          path: app/build/outputs/apk/debug/app-debug.apk
